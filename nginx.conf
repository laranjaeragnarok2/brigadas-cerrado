server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Habilita compressão Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Suporte a SPA Routing (redireciona rotas virtuais como /brigadas para /index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Desabilita cache para o Service Worker da PWA
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
